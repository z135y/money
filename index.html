<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍵 茶葉 POS - 專業營運穩定版</title>
    <style>
        :root { 
            --primary: #2c3e50; --success: #27ae60; --warning: #f39c12; 
            --danger: #e74c3c; --line-green: #00c300; --bank-blue: #0984e3; --bg: #f4f7f6;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; margin: 0; background-color: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        
        /* 頂部狀態 */
        .status-header { background: #34495e; color: white; padding: 8px 15px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .status-pill { padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .online-pill { background: var(--success); }
        .offline-pill { background: var(--danger); }
        .hw-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; background: #95a5a6; }
        .hw-dot.active { background: var(--success); box-shadow: 0 0 5px var(--success); }

        /* 商品展示區 */
        .product-area { flex: 7; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 15px; align-content: start; }
        .category-title { grid-column: 1 / -1; font-size: 13px; color: #7f8c8d; font-weight: bold; margin: 15px 0 8px; border-left: 4px solid var(--primary); padding-left: 10px; text-transform: uppercase; }
        .product-card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; border: 2px solid transparent; transition: 0.1s; display: flex; flex-direction: column; justify-content: space-between; height: 140px; }
        .product-card:active { transform: scale(0.96); border-color: var(--success); }
        .product-card.out-of-stock { opacity: 0.5; filter: grayscale(1); pointer-events: none; }
        .product-card.out-of-stock::after { content: "補貨中"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); color: var(--danger); font-weight: bold; border: 1px solid var(--danger); padding: 2px 5px; background: white; border-radius: 4px; font-size: 12px; }
        
        .p-name { font-weight: bold; font-size: 14px; color: var(--primary); display: block; height: 40px; overflow: hidden; line-height: 1.3; }
        .p-price { color: var(--warning); font-weight: bold; font-size: 13px; margin-top: 5px; }
        .p-stock { font-size: 10px; color: #95a5a6; margin-top: 6px; background: #f0f2f5; padding: 2px 6px; border-radius: 4px; display: inline-block; align-self: center; }
        .p-stock.low-stock { color: white; background: var(--danger); }

        /* 右側結帳區 */
        .sidebar { flex: 3; background: white; display: flex; flex-direction: column; border-left: 1px solid #dcdde1; min-width: 360px; box-shadow: -5px 0 15px rgba(0,0,0,0.03); }
        .cart-header { padding: 15px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .cart-list { flex: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #f1f2f6; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid #f9f9f9; font-size: 14px; }
        
        /* 結帳區刪除鍵樣式 */
        .btn-del-item { color: #bdc3c7; cursor: pointer; font-size: 20px; font-weight: bold; padding: 0 5px; transition: color 0.2s; user-select: none; }
        .btn-del-item:hover { color: var(--danger); }

        .step-section { padding: 10px 15px; border-bottom: 1px solid #f1f2f6; }
        .step-label { font-size: 11px; color: #95a5a6; font-weight: bold; margin-bottom: 8px; display: block; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .opt-btn { padding: 8px 0; font-size: 11px; border: 1px solid #eee; background: #f9f9f9; border-radius: 6px; cursor: pointer; transition: 0.1s; text-align: center; }
        .opt-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }

        .footer-section { padding: 20px; background: #fafafa; border-top: 1px solid #eee; }
        .price-row { display: flex; justify-content: space-between; font-size: 13px; color: #7f8c8d; margin-bottom: 5px; }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .total-val { font-size: 32px; font-weight: 900; color: var(--primary); }
        .btn-pay { width: 100%; padding: 18px; background: var(--success); color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2); }

        .drive-backup { padding: 10px 15px; background: #e8f0fe; font-size: 11px; display: flex; justify-content: space-between; align-items: center; color: #1967d2; border-top: 1px solid #d2e3fc; }
        .btn-save-file { border:none; background:#1967d2; color:white; padding:4px 10px; border-radius:4px; cursor:pointer; font-weight: bold; }

        /* 支付彈窗 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .modal-body { background: white; padding: 30px; border-radius: 24px; text-align: center; width: 340px; }
        .qr-wrapper { width: 250px; height: 250px; margin: 15px auto; background: white; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid #eee; overflow: hidden; }
        .qr-wrapper img { width: 100%; height: 100%; object-fit: contain; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 30px; color: white; display: none; z-index: 11000; font-size: 14px; }

        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { min-width: 100%; height: 60vh; } }
    </style>
</head>
<body>

<div id="toast"></div>

<!-- 支付核對彈窗 -->
<div class="modal" id="payModal">
    <div class="modal-body">
        <h3 id="mTitle" style="margin:0;">支付核對</h3>
        <p style="font-size: 12px; color: #95a5a6; margin: 5px 0 15px;">請確認收款圖示並核對金額</p>
        <div id="bankInfo" style="background:#f1f2f6; padding:12px; border-radius:12px; font-size:13px; text-align:left; margin-bottom:15px; display:none; line-height:1.6;">
            <b>台新 (812)</b><br>帳號：2888-10-2195140-5<br>戶名：鄭宇翔
        </div>
        <div class="qr-wrapper">
            <img id="mQR" src="" alt="圖片載入中...">
        </div>
        <div id="mPrice" style="font-size: 28px; font-weight: 900; color: var(--danger);">$0</div>
        <button class="btn-pay" onclick="executeFinalSync()">已收到款項 (結帳)</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#bdc3c7; margin-top:15px; font-size:12px; cursor:pointer;">返回修改</button>
    </div>
</div>

<div style="display:flex; flex-direction:column; width:100%;">
    <div class="status-header">
        <div>

        <div>

    <div style="display:flex; flex:1; overflow:hidden;">
        <div class="product-area" id="productGrid"></div>

        <div class="sidebar">

            </div>
            
            <div class="cart-list" id="cartItems">
                <div style="text-align:center; color:#bdc3c7; margin-top:50px;">點選商品或掃描條碼</div>
            </div>

            <div class="control-panel">
                <div class="step-section">
                    <span class="step-label">1. 折扣選取</span>
                    <div class="btn-grid" id="discGrid">
                        <button class="opt-btn active" onclick="setOpt('disc', 0, this)">無</button>
                        <button class="opt-btn" onclick="setOpt('disc', 0.9, this)">9折</button>
                        <button class="opt-btn" onclick="setOpt('disc', 0.8, this)">8折</button>
                        <button class="opt-btn" onclick="setOpt('disc', -50, this)">-50</button>
                    </div>
                </div>

                <div class="step-section">
                    <span class="step-label">2. 顧客輪廓分析</span>
                    <div class="btn-grid" id="genderGrid" style="margin-bottom:5px;">
                        <button class="opt-btn active" onclick="setOpt('gender', '未知', this)">未知</button>
                        <button class="opt-btn" onclick="setOpt('gender', '男', this)">男</button>
                        <button class="opt-btn" onclick="setOpt('gender', '女', this)">女</button>
                        <button class="opt-btn" onclick="setOpt('gender', '多元', this)">多元</button>
                    </div>
                    <div class="btn-grid" id="ageGrid">
                        <button class="opt-btn" onclick="setOpt('age', '-20', this)">-20</button>
                        <button class="opt-btn" onclick="setOpt('age', '21-35', this)">21-35</button>
                        <button class="opt-btn" onclick="setOpt('age', '36-50', this)">36-50</button>
                        <button class="opt-btn active" onclick="setOpt('age', '51+', this)">51+</button>
                    </div>
                </div>

                <div class="step-section" style="border-bottom:none;">
                    <span class="step-label">3. 支付方式</span>
                    <div class="btn-grid" id="methodGrid">
                        <button class="opt-btn active" onclick="setOpt('method', '現金', this)">現金</button>
                        <button class="opt-btn" onclick="setOpt('method', 'LinePay', this)">Line</button>
                        <button class="opt-btn" onclick="setOpt('method', '轉帳', this)">轉帳</button>
                        <button class="opt-btn" onclick="setMethod('信用卡', this)">刷卡</button>
                    </div>
                </div>
            </div>

            <div class="drive-backup">
                <span>備援: 離線備份佇列 (<span id="localCount">0</span>)</span>
                <button onclick="downloadLogForDrive()" class="btn-save-file">離線手動匯出</button>
            </div>

            <div class="footer-section">
                <div class="price-row"><span>小計 (原價)</span><span id="subTotal">$0</span></div>
                <div class="price-row"><span>折扣金額</span><span id="discAmt" style="color:var(--danger)">-$0</span></div>
                <div class="total-row">
                    <span style="color: #95a5a6; font-size: 14px;">應收總計</span>
                    <span class="total-val" id="finalTotal">$0</span>
                </div>
                <button class="btn-pay" onclick="handlePayAction()">確認結帳並上傳</button>
                <button onclick="clearAll()" style="width:100%; border:none; background:none; color:var(--danger); font-size:11px; margin-top:10px; cursor:pointer; text-decoration:underline;">清空重來</button>
            </div>
        </div>
    </div>
</div>

    let cart = {};
    let state = { disc: 0, gender: '未知', age: '51+', method: '現金' };
    let syncQueue = [];
    let allHistory = []; 
    let barcodeBuffer = "";

    window.onload = () => { loadData(); render(); initNet(); refreshStock(); setupUSB(); };

    function notify(m, isErr = false) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.background = isErr ? 'var(--danger)' : '#333';
        t.style.display = 'block'; setTimeout(() => t.style.display='none', 3000);
    }

    // USB 掃描槍邏輯
    function setupUSB() {
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (barcodeBuffer.length > 0) {
                    const p = PRODUCTS.find(x => x.barcode === barcodeBuffer);
                    if(p) { addToCart(p.id); notify(`📢 掃描: ${p.name}`); }
                    barcodeBuffer = "";
                }
            } else if (e.key.length === 1) { barcodeBuffer += e.key; }
            clearTimeout(window.scanT);
            window.scanT = setTimeout(() => { barcodeBuffer = ""; }, 100);
        });
    }

    // Google Drive 手動備份
    function downloadLogForDrive() {
        if (allHistory.length === 0) return notify("無交易紀錄可備份", true);
        const dataStr = JSON.stringify(allHistory, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `POS_Backup_${new Date().toLocaleDateString().replace(/\//g,'-')}.json`;
        a.click();
        notify("💾 備份檔已下載");
    }

    function render() {

        grid.innerHTML = ""; let curCat = "";
        PRODUCTS.forEach(p => {
            if(p.cat !== curCat) {
                grid.innerHTML += `<div class="category-title">${p.cat}</div>`;
                curCat = p.cat;
            }
            const isOut = p.stock <= 0 && p.id < 20; 
            const lowClass = (p.stock > 0 && p.stock <= 5) ? 'low-stock' : '';
            grid.innerHTML += `
                <div class="product-card ${isOut ? 'out-of-stock' : ''}" onclick="addToCart(${p.id})">
                    <span class="p-name">${p.name}</span>
                    <div>
                        <span class="p-price">$${p.price}</span><br>
                        <span class="p-stock ${lowClass}">庫存: ${p.stock}</span>
                    </div>
                </div>`;
        });
    }

    function addToCart(id) {
        const p = PRODUCTS.find(x => x.id === id);
        const qty = cart[id]?.qty || 0;
        if (p.id < 20 && qty + 1 > p.stock) return notify(`❌ 庫存不足`, true);
        cart[id] = { ...p, qty: qty + 1 }; updateUI();
    }

    // ✨ 新增：結帳區個別刪除功能
    function removeFromCart(id) {
        if (cart[id]) {
            if (cart[id].qty > 1) {
                cart[id].qty--;
            } else {
                delete cart[id];
            }
            updateUI();
        }
    }

    function updateUI() {
        const list = document.getElementById('cartItems');
        const items = Object.values(cart);
        if(items.length === 0) {
            list.innerHTML = `<div style="text-align:center; color:#bdc3c7; margin-top:50px;">尚未選擇商品</div>`;
            document.getElementById('subTotal').innerText = "$0";
            document.getElementById('discAmt').innerText = "-$0";
            document.getElementById('finalTotal').innerText = "$0";
            return;
        }
        
        // ✨ 修改：加入刪除鍵 (btn-del-item)
        list.innerHTML = items.map(i => `
            <div class="cart-item">
                <div style="flex:1;">
                    <span style="font-weight:bold;">${i.name}</span>
                </div>
                <div style="display:flex; align-items:center;">
                    <b style="color:var(--primary); margin-right:15px;">x ${i.qty}</b>
                    <span class="btn-del-item" onclick="removeFromCart(${i.id})" title="減少數量或刪除">×</span>
                </div>
            </div>`).join('');

        const sub = items.reduce((s, i) => s + (i.price * i.qty), 0);
        let final = sub;
        let discAmt = 0;
        if(state.disc > 0 && state.disc < 1) {
            final = Math.round(sub * state.disc); discAmt = sub - final;
        } else if(state.disc < 0) {
            discAmt = Math.abs(state.disc); final = Math.max(0, sub - discAmt);
        }
        
        document.getElementById('subTotal').innerText = "$" + sub;
        document.getElementById('discAmt').innerText = "-$" + discAmt;
        document.getElementById('finalTotal').innerText = "$" + final;
    }

    function setOpt(k, v, btn) {
        state[k] = v;
        const g = k === 'disc' ? 'discGrid' : k === 'gender' ? 'genderGrid' : k === 'age' ? 'ageGrid' : 'methodGrid';
        document.querySelectorAll(`#${g} .opt-btn`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); updateUI();
    }

    function handlePayAction() {
        const total = document.getElementById('finalTotal').innerText;
        if(total === "$0") return notify("清單為空", true);
        
        if(state.method === 'LinePay' || state.method === '轉帳') {
            document.getElementById('mTitle').innerText = state.method === 'LinePay' ? 'LINE Pay 收款' : '銀行轉帳資訊';
            document.getElementById('mQR').src = state.method === 'LinePay' ? LINE_PAY_IMG : BANK_TRANSFER_IMG;
            document.getElementById('bankInfo').style.display = state.method === '轉帳' ? 'block' : 'none';
            document.getElementById('mPrice').innerText = total;
            document.getElementById('payModal').style.display = 'flex';
        } else { executeFinalSync(); }
    }

    function executeFinalSync() {
        closeModal();
        const items = Object.values(cart);
        const subtotal = items.reduce((s, i) => s + (i.price * i.qty), 0);
        const total = parseInt(document.getElementById('finalTotal').innerText.replace("$",""));
        
        const payload = {
            itemsString: items.map(i => `${i.name}x${i.qty}`).join(','),
            cartItems: items.map(i => ({id: i.id, qty: i.qty})),
            originalTotal: subtotal,
            discount: subtotal - total,
            finalTotal: total,
            method: state.method,
            gender: state.gender,
            age: state.age,
            note: state.disc !== 0 ? `折扣:${state.disc}` : '',
            ts: Date.now()
        };
        syncQueue.push(payload); 
        allHistory.push(payload);
        saveData();
        
        // 樂觀庫存更新
        items.forEach(item => { const p = PRODUCTS.find(x => x.id === item.id); if (p) p.stock -= item.qty; });
        
        clearAll(); render(); processQueue();
        notify(navigator.onLine ? "✅ 結帳成功，同步中..." : "⚠️ 離線結帳成功，已存入佇列");
    }

    function saveData() { 
        localStorage.setItem('pos_v11_q', JSON.stringify(syncQueue)); 
        localStorage.setItem('pos_v11_h', JSON.stringify(allHistory)); 
        updateQueue(); 
    }
    
    function loadData() { 
        const q = localStorage.getItem('pos_v11_q'); 
        const h = localStorage.getItem('pos_v11_h');
        if(q) syncQueue = JSON.parse(q); 
        if(h) allHistory = JSON.parse(h);
        updateQueue(); 
    }

    function updateQueue() {
        const el = document.getElementById('syncStatus');
        el.innerText = syncQueue.length > 0 ? `待同步: ${syncQueue.length} 筆` : "雲端已同步";
        el.parentElement.style.color = syncQueue.length > 0 ? "var(--warning)" : "white";
        document.getElementById('localCount').innerText = syncQueue.length;
    }

    async function processQueue() {
        if(!navigator.onLine || syncQueue.length === 0) return;
        const data = syncQueue[0];
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            syncQueue.shift(); saveData(); processQueue();
        } catch(e) {}
    }

    function refreshStock() {
        fetch(SCRIPT_URL).then(r => r.json()).then(d => {
            PRODUCTS.forEach(p => { if(d[p.id] !== undefined) p.stock = d[p.id]; }); render();
        });
    }

    function initNet() {
        const up = () => {
            const on = navigator.onLine;
            const pill = document.getElementById('netStatusPill');
            pill.innerText = on ? "🟢 線上" : "🔴 離線";
            pill.className = `status-pill ${on ? 'online-pill' : 'offline-pill'}`;
            if(on) processQueue();
        };
        window.addEventListener('online', up); window.addEventListener('offline', up); up();
    }

    function clearAll() { cart = {}; state.disc = 0; updateUI(); }
    function closeModal() { document.getElementById('payModal').style.display = 'none'; }
</script>

</body>
</html>
