<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍵 茶葉 POS - 專業營運穩定版 (含支出管理+面額盤點)</title>
    <style>
        :root { 
            --primary: #2c3e50; --success: #27ae60; --warning: #f39c12; 
            --danger: #e74c3c; --line-green: #00c300; --bank-blue: #0984e3; --bg: #f4f7f6;
            --inv-bg: #151e2b; --inv-border: #00e5ff; --inv-text: #e2e8f0;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; margin: 0; background-color: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        
        /* 頂部狀態 */
        .status-header { background: #34495e; color: white; padding: 8px 15px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-shrink: 0; }
        .status-pill { padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .online-pill { background: var(--success); }
        .offline-pill { background: var(--danger); }
        
        .btn-toggle-view { background: #00e5ff; color: #151e2b; border: none; padding: 4px 12px; border-radius: 15px; font-size: 11px; font-weight: bold; cursor: pointer; margin-left: 15px; }
        .btn-shift { background: #f39c12; color: white; border: none; padding: 4px 12px; border-radius: 15px; font-size: 11px; font-weight: bold; cursor: pointer; margin-left: 8px; }
        .btn-expense { background: #e74c3c; color: white; border: none; padding: 4px 12px; border-radius: 15px; font-size: 11px; font-weight: bold; cursor: pointer; margin-left: 8px; }

        /* 商品展示區 (POS) */
        .product-area { flex: 7; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 15px; align-content: start; }
        .category-title { grid-column: 1 / -1; font-size: 13px; color: #7f8c8d; font-weight: bold; margin: 15px 0 8px; border-left: 4px solid var(--primary); padding-left: 10px; }
        .product-card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; border: 2px solid transparent; height: 140px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .product-card:active { transform: scale(0.96); border-color: var(--success); }
        .p-name { font-weight: bold; font-size: 14px; color: var(--primary); }
        .p-price { color: var(--warning); font-weight: bold; }
        .p-stock { font-size: 10px; color: #95a5a6; background: #f0f2f5; padding: 2px 6px; border-radius: 4px; }

        /* 右側結帳區 */
        .sidebar { flex: 3; background: white; display: flex; flex-direction: column; border-left: 1px solid #dcdde1; min-width: 360px; }
        .cart-header { padding: 15px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .cart-list { flex: 1; overflow-y: auto; padding: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f9f9f9; font-size: 14px; }
        
        .footer-section { padding: 20px; background: #fafafa; border-top: 1px solid #eee; }
        .total-val { font-size: 32px; font-weight: 900; color: var(--primary); }
        .btn-pay { width: 100%; padding: 15px; background: var(--success); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* 盤點與彈窗樣式 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-body { background: white; padding: 25px; border-radius: 20px; width: 380px; max-height: 90vh; overflow-y: auto; }
        .cash-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .cash-table td { padding: 8px; border-bottom: 1px solid #eee; }
        .cash-input { width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; text-align: center; font-size: 16px; }
        .denom-label { font-weight: bold; color: var(--primary); width: 80px; }
        
        .modal-input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }

        /* 庫存視圖 */
        #inventoryContainer { display: none; flex: 1; background-color: var(--inv-bg); padding: 30px; overflow-y: auto; color: var(--inv-text); }
        .inv-table { width: 100%; border-collapse: collapse; color: white; }
        .inv-table th, .inv-table td { padding: 12px; border-bottom: 1px solid #2d3b4e; text-align: left; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 30px; color: white; display: none; z-index: 2000; }
    </style>
</head>
<body>

<div id="toast"></div>

<!-- 臨時支出彈窗 -->
<div class="modal" id="expenseModal">
    <div class="modal-body">
        <h3 style="margin-top:0; color:var(--danger);">🧾 錄入臨時支出</h3>
        <p style="font-size: 12px; color: #7f8c8d;">此筆金額將從今日現金營收中扣除</p>
        <label style="font-size:12px; font-weight:bold;">支出項目</label>
        <input type="text" id="expDesc" class="modal-input" placeholder="例如：買抹布、雜支...">
        <label style="font-size:12px; font-weight:bold;">支出金額</label>
        <input type="number" id="expAmount" class="modal-input" placeholder="0" min="1">
        <button class="btn-pay" style="background:var(--danger);" onclick="submitExpense()">確認支出並扣款</button>
        <button onclick="closeModal('expenseModal')" style="background:none; border:none; color:#bdc3c7; width:100%; margin-top:10px; cursor:pointer;">取消</button>
    </div>
</div>

<!-- 開班盤點彈窗 -->
<div class="modal" id="shiftModal">
    <div class="modal-body">
        <h3 style="margin-top:0; color:var(--primary);">💰 開班零用金盤點</h3>
        <table class="cash-table">
            <tbody id="denomTbody">
                <!-- 由 JS 生成面額輸入框 -->
            </tbody>
        </table>
        <div style="background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:15px;">
            <div style="display:flex; justify-content:space-between; font-weight:bold;">
                <span>盤點總額：</span>
                <span id="denomTotal" style="color:var(--success); font-size:20px;">$0</span>
            </div>
        </div>
        <input type="text" id="operatorName" class="modal-input" placeholder="操作人員姓名">
        <button class="btn-pay" id="btnOpenShift" onclick="submitOpenShift()">確認開班</button>
        <button onclick="closeModal('shiftModal')" style="background:none; border:none; color:#bdc3c7; width:100%; margin-top:10px; cursor:pointer;">取消</button>
    </div>
</div>

<!-- 業績查詢彈窗 -->
<div class="modal" id="salesModal">
    <div class="modal-body">
        <h3 style="margin-top:0;">📊 當前班次業績</h3>
        <div id="salesReportContent" style="font-size:14px; line-height:1.8;">
            <!-- JS 動態生成內容 -->
        </div>
        <button class="btn-pay" style="background:var(--primary); margin-top:15px;" onclick="closeModal('salesModal')">關閉</button>
        <button onclick="endShiftOnly()" style="background:none; border:none; color:var(--danger); width:100%; margin-top:10px; text-decoration:underline; cursor:pointer;">結束本班次</button>
    </div>
</div>

<!-- 支付核對彈窗 -->
<div class="modal" id="payModal">
    <div class="modal-body" style="text-align:center;">
        <h3 id="mTitle">支付核對</h3>
        <div id="bankInfo" style="display:none; text-align:left; background:#eee; padding:10px; font-size:12px; margin-bottom:10px;">
            <b>台新 (812)</b><br>帳號：2888-10-2195140-5<br>戶名：鄭宇翔
        </div>
        <div id="mPrice" style="font-size:32px; font-weight:900; color:var(--danger); margin-bottom:15px;">$0</div>
        <button class="btn-pay" onclick="executeFinalSync()">確認已收款</button>
        <button onclick="closeModal('payModal')" style="background:none; border:none; color:#ccc; margin-top:10px;">返回</button>
    </div>
</div>

<div style="display:flex; flex-direction:column; width:100%; height: 100%;">
    <div class="status-header">
        <div>
            <span class="status-pill online-pill" id="netStatusPill">🟢 線上</span>
            <span id="syncStatus" style="margin-left:10px;">雲端已同步</span>
            <button class="btn-toggle-view" onclick="toggleView()" id="viewToggleBtn">📊 庫存管理</button>
            <button class="btn-shift" onclick="openShiftModal()">💰 開班盤點</button>
            <button class="btn-expense" onclick="openExpenseModal()">🧾 記支出</button>
        </div>
        <div>
            <button class="btn-shift" style="background:var(--bank-blue);" onclick="openSalesModal()">📈 業績</button>
        </div>
    </div>

    <div id="posContainer" style="display:flex; flex:1; overflow:hidden;">
        <div class="product-area" id="productGrid"></div>
        <div class="sidebar">
            <div class="cart-header">🛒 購物清單 <button onclick="refreshStock()" style="background:none; border:none; color:white; cursor:pointer;">🔄</button></div>
            <div class="cart-list" id="cartItems"></div>
            <div class="footer-section">
                <div style="display:flex; justify-content:space-between; color:#7f8c8d; font-size:14px; margin-bottom:5px;">
                    <span>小計</span><span id="subTotal">$0</span>
                </div>
                <div style="display:flex; justify-content:space-between; color:var(--danger); font-size:14px; margin-bottom:10px;">
                    <span>折抵</span><span id="discAmt">-$0</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <span style="font-size:14px;">應收總計</span>
                    <span class="total-val" id="finalTotal">$0</span>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-bottom:10px;">
                    <button class="opt-btn" id="method-cash" onclick="setMethod('現金', this)" style="padding:10px; background:var(--primary); color:white; border-radius:8px; border:none; cursor:pointer;">現金</button>
                    <button class="opt-btn" onclick="setMethod('LinePay', this)" style="padding:10px; background:#eee; border-radius:8px; border:none; cursor:pointer;">LinePay</button>
                </div>
                <button class="btn-pay" onclick="handlePayAction()">結帳上傳</button>
                <button onclick="clearAll()" style="width:100%; border:none; background:none; color:var(--danger); font-size:11px; margin-top:10px; text-decoration:underline;">清空清單</button>
            </div>
        </div>
    </div>

    <div id="inventoryContainer">
        <h2>庫存監控</h2>
        <table class="inv-table">
            <thead><tr><th>品名</th><th>售價</th><th>庫存</th></tr></thead>
            <tbody id="inventoryTbody"></tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWWTZNNbSesSrb3WqHP1OrnwQLVPj5zzAV3XlDqDcocqR9kWzcwYl9hBFQcFKo0Hj84A/exec";
    
    const DENOMS = [1000, 500, 100, 50, 10, 5, 1];
    const PRODUCTS = [
        { id: 1,  cat: "📦 茶葉", name: '文山包種茶', price: 300, stock: 10 },
        { id: 2,  cat: "📦 茶葉", name: '蜜香紅茶', price: 350, stock: 10 },
        { id: 20, cat: "🍰 甜點", name: '包種茶布丁', price: 70, stock: 20 },
        { id: 21, cat: "🍰 甜點", name: '蜜香紅茶布丁', price: 70, stock: 20 },
        { id: 22, cat: "🍰 甜點", name: '原味布丁', price: 65, stock: 20 }
    ];

    let cart = {};
    let currentMethod = '現金';
    let shiftData = JSON.parse(localStorage.getItem('pos_shift_data')) || null;
    let allHistory = JSON.parse(localStorage.getItem('pos_history')) || [];
    let syncQueue = JSON.parse(localStorage.getItem('pos_queue')) || [];

    window.onload = () => {
        initDenomTable();
        render();
        updateQueueUI();
    };

    // --- 支出功能 ---
    function openExpenseModal() {
        if(!shiftData) return notify("⚠️ 請先開班盤點", true);
        document.getElementById('expenseModal').style.display = 'flex';
    }

    function submitExpense() {
        const desc = document.getElementById('expDesc').value;
        const amt = parseInt(document.getElementById('expAmount').value);

        if(!desc || isNaN(amt) || amt <= 0) return notify("❌ 請填寫支出內容與金額", true);

        const payload = {
            type: 'EXPENSE',
            itemsString: `[支出] ${desc}`,
            finalTotal: amt,
            method: '現金',
            ts: Date.now(),
            note: '臨時支出'
        };

        allHistory.push(payload);
        syncQueue.push(payload);
        savePersistent();
        notify(`✅ 記錄支出: ${desc} $${amt}`);
        closeModal('expenseModal');
        document.getElementById('expDesc').value = '';
        document.getElementById('expAmount').value = '';
        processQueue();
    }

    // --- 開班盤點功能 ---
    function initDenomTable() {
        const tbody = document.getElementById('denomTbody');
        tbody.innerHTML = DENOMS.map(d => `
            <tr>
                <td class="denom-label">${d} 元</td>
                <td><input type="number" class="cash-input" data-unit="${d}" value="0" min="0" oninput="calcPettyCash()"></td>
                <td id="sub-${d}" style="text-align:right; width:80px; color:#7f8c8d;">$0</td>
            </tr>
        `).join('');
    }

    function calcPettyCash() {
        let total = 0;
        document.querySelectorAll('.cash-input').forEach(input => {
            const unit = parseInt(input.dataset.unit);
            const count = parseInt(input.value) || 0;
            const sub = unit * count;
            document.getElementById(`sub-${unit}`).innerText = `$${sub}`;
            total += sub;
        });
        document.getElementById('denomTotal').innerText = `$${total}`;
        return total;
    }

    function openShiftModal() {
        if(shiftData) return notify("⚠️ 目前已在開班狀態");
        document.getElementById('shiftModal').style.display = 'flex';
    }

    function submitOpenShift() {
        const total = calcPettyCash();
        const operator = document.getElementById('operatorName').value || '未填';
        
        shiftData = { 
            pettyCash: total, 
            operator: operator, 
            openTime: Date.now(),
            denoms: Array.from(document.querySelectorAll('.cash-input')).map(i => ({unit: i.dataset.unit, count: i.value}))
        };

        localStorage.setItem('pos_shift_data', JSON.stringify(shiftData));
        
        // 發送到雲端記錄開班
        const payload = { action: 'openShift', pettyCash: total, operator: operator, ts: Date.now() };
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });

        notify(`✅ 開班成功！零用金：$${total}`);
        closeModal('shiftModal');
    }

    // --- 業績查詢 ---
    function openSalesModal() {
        if(!shiftData) return notify("⚠️ 尚未開班", true);
        
        const sessionOrders = allHistory.filter(o => o.ts >= shiftData.openTime);
        let cashSales = 0;
        let nonCashSales = 0;
        let expenses = 0;
        let expenseList = "";

        sessionOrders.forEach(o => {
            if(o.type === 'EXPENSE') {
                expenses += o.finalTotal;
                expenseList += `<div style="color:red; font-size:12px;">└ ${o.itemsString} -$${o.finalTotal}</div>`;
            } else if(o.method === '現金') {
                cashSales += o.finalTotal;
            } else {
                nonCashSales += o.finalTotal;
            }
        });

        const expectedCash = shiftData.pettyCash + cashSales - expenses;

        document.getElementById('salesReportContent').innerHTML = `
            <p><b>開班時間：</b>${new Date(shiftData.openTime).toLocaleString()}</p>
            <hr>
            <div>初始零用金：$${shiftData.pettyCash}</div>
            <div style="color:var(--success);">+ 現金收入：$${cashSales}</div>
            <div style="color:var(--danger);">- 臨時支出：$${expenses}</div>
            ${expenseList}
            <div style="background:#eee; padding:10px; margin:10px 0; font-size:18px; font-weight:bold;">
                預計抽屜現金：$${expectedCash}
            </div>
            <div style="color:var(--bank-blue);">非現金營收 (LinePay/刷卡)：$${nonCashSales}</div>
        `;
        document.getElementById('salesModal').style.display = 'flex';
    }

    function endShiftOnly() {
        if(confirm("確定結束班次？這將清除本機開班紀錄。")) {
            localStorage.removeItem('pos_shift_data');
            shiftData = null;
            closeModal('salesModal');
            notify("✅ 班次已結束");
        }
    }

    // --- POS 基礎功能 ---
    function render() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = ""; let lastCat = "";
        PRODUCTS.forEach(p => {
            if(p.cat !== lastCat) {
                grid.innerHTML += `<div class="category-title">${p.cat}</div>`;
                lastCat = p.cat;
            }
            grid.innerHTML += `
                <div class="product-card" onclick="addToCart(${p.id})">
                    <span class="p-name">${p.name}</span>
                    <div>
                        <span class="p-price">$${p.price}</span><br>
                        <span class="p-stock">庫存: ${p.stock}</span>
                    </div>
                </div>`;
        });
    }

    function addToCart(id) {
        if(!shiftData) return notify("⚠️ 請先開班盤點", true);
        const p = PRODUCTS.find(x => x.id === id);
        const key = `${id}_${Date.now()}`;
        cart[key] = { ...p, cartKey: key };
        updateUI();
    }

    function updateUI() {
        const list = document.getElementById('cartItems');
        const items = Object.values(cart);
        list.innerHTML = items.map(i => `
            <div class="cart-item">
                <span>${i.name}</span>
                <span>$${i.price} <button onclick="removeItem('${i.cartKey}')" style="border:none; color:red; background:none; cursor:pointer;">×</button></span>
            </div>
        `).join('');

        const sub = items.reduce((a, b) => a + b.price, 0);
        document.getElementById('subTotal').innerText = `$${sub}`;
        document.getElementById('finalTotal').innerText = `$${sub}`;
    }

    function removeItem(key) { delete cart[key]; updateUI(); }

    function setMethod(m, btn) {
        currentMethod = m;
        document.querySelectorAll('.opt-btn').forEach(b => {
            b.style.background = '#eee'; b.style.color = 'black';
        });
        btn.style.background = 'var(--primary)'; btn.style.color = 'white';
    }

    function handlePayAction() {
        if(Object.keys(cart).length === 0) return notify("清單是空的", true);
        if(currentMethod === '現金') {
            executeFinalSync();
        } else {
            document.getElementById('mPrice').innerText = document.getElementById('finalTotal').innerText;
            document.getElementById('payModal').style.display = 'flex';
        }
    }

    function executeFinalSync() {
        const items = Object.values(cart);
        const total = items.reduce((a, b) => a + b.price, 0);
        const names = items.map(i => i.name).join(', ');

        const payload = {
            type: 'SALE',
            itemsString: names,
            finalTotal: total,
            method: currentMethod,
            ts: Date.now(),
            note: ''
        };

        allHistory.push(payload);
        syncQueue.push(payload);
        savePersistent();
        
        cart = {};
        updateUI();
        closeModal('payModal');
        notify("✅ 結帳完成");
        processQueue();
    }

    function savePersistent() {
        localStorage.setItem('pos_history', JSON.stringify(allHistory));
        localStorage.setItem('pos_queue', JSON.stringify(syncQueue));
        updateQueueUI();
    }

    function updateQueueUI() {
        const q = document.getElementById('syncStatus');
        q.innerText = syncQueue.length > 0 ? `待同步: ${syncQueue.length}` : "雲端已同步";
    }

    async function processQueue() {
        if(!navigator.onLine || syncQueue.length === 0) return;
        const data = syncQueue[0];
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            syncQueue.shift();
            savePersistent();
            processQueue();
        } catch(e) { console.log("等待連線..."); }
    }

    function toggleView() {
        const pos = document.getElementById('posContainer');
        const inv = document.getElementById('inventoryContainer');
        const isPos = pos.style.display !== 'none';
        pos.style.display = isPos ? 'none' : 'flex';
        inv.style.display = isPos ? 'block' : 'none';
        if(!isPos) renderInventory();
    }

    function renderInventory() {
        const tb = document.getElementById('inventoryTbody');
        tb.innerHTML = PRODUCTS.map(p => `<tr><td>${p.name}</td><td>${p.price}</td><td>${p.stock}</td></tr>`).join('');
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function notify(m, err=false) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.background = err ? 'red' : '#333';
        t.style.display = 'block';
        setTimeout(() => t.style.display='none', 2000);
    }
    function clearAll() { cart = {}; updateUI(); }
    function refreshStock() { notify("🔄 庫存已刷新 (模擬)"); }
</script>

</body>
</html>
